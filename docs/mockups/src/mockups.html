<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Baggage Rush mockups</title>
<style>
@font-face{font-family:Rubik;src:url(fonts/rubik-cyr.woff2) format('woff2');font-weight:300 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:Rubik;src:url(fonts/rubik-lat.woff2) format('woff2');font-weight:300 900;}
html,body{margin:0;background:#1b2436;}
body{display:flex;flex-wrap:wrap;gap:24px;padding:24px;}
svg{font-family:Rubik,sans-serif;display:block;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2a44" flood-opacity=".25"/>
    </filter>
    <filter id="shBig" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1426" flood-opacity=".45"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc0ff"/><stop offset="1" stop-color="#d4f0ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="starter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ff4f8b"/>
    </linearGradient>
    <linearGradient id="shopBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34558f"/><stop offset="1" stop-color="#1f3156"/>
    </linearGradient>
    <linearGradient id="multi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ccf6e"/><stop offset=".5" stop-color="#ff5a5f"/><stop offset="1" stop-color="#3ccf6e"/>
    </linearGradient>
  </defs>
</svg>

<svg id="gameplay" width="540" height="960" viewBox="0 0 540 960"></svg>
<svg id="win" width="540" height="960" viewBox="0 0 540 960"></svg>
<svg id="lose" width="540" height="960" viewBox="0 0 540 960"></svg>
<svg id="hub" width="540" height="960" viewBox="0 0 540 960"></svg>
<svg id="shop" width="540" height="960" viewBox="0 0 540 960"></svg>

<script>
const C = {red:'#ff5a5f', blue:'#3d8bff', green:'#2fc76a', yellow:'#ffc531', purple:'#9b5de5',
           orange:'#ff8c2b', grey:'#8a96a8', ink:'#23324a', sub:'#6b7a92'};
let uid = 0;

function shade(hex, p){
  const n = parseInt(hex.slice(1),16); let r=n>>16, g=n>>8&255, b=n&255;
  const t = p<0?0:255, a = Math.abs(p);
  r=Math.round((t-r)*a+r); g=Math.round((t-g)*a+g); b=Math.round((t-b)*a+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function T(x,y,str,o={}){
  const {size=16,w=700,fill=C.ink,anchor='middle',stroke=null,sw=4,rot=0,op=1,style=''}=o;
  return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="${anchor}" opacity="${op}"`+
    (stroke?` stroke="${stroke}" stroke-width="${sw}" paint-order="stroke" stroke-linejoin="round"`:'')+
    (rot?` transform="rotate(${rot} ${x} ${y})"`:'')+(style?` style="${style}"`:'')+`>${str}</text>`;
}
function rng(seed){ return ()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }; }

function star(cx,cy,r,fill='url(#gold)',stroke='#d98e00',sw=3){
  let p='';
  for(let i=0;i<10;i++){
    const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.48:r;
    p+=(i?'L':'M')+(cx+rr*Math.cos(a)).toFixed(1)+' '+(cy+rr*Math.sin(a)).toFixed(1);
  }
  return `<path d="${p}Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
}
function coin(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#e89a00"/>
  <circle cx="${cx}" cy="${cy-r*0.08}" r="${r*0.9}" fill="#ffd23f"/>
  <circle cx="${cx}" cy="${cy-r*0.08}" r="${r*0.55}" fill="none" stroke="#f0a800" stroke-width="${r*0.14}"/>
  <ellipse cx="${cx-r*0.35}" cy="${cy-r*0.45}" rx="${r*0.22}" ry="${r*0.13}" fill="#fff" opacity=".7" transform="rotate(-35 ${cx-r*0.35} ${cy-r*0.45})"/>`;
}
function coinPile(cx,by,n){
  let s='';
  const pos=[[0,0],[-14,0],[14,0],[-7,-9],[7,-9],[0,-18],[-21,-9],[21,-9],[-14,-18],[14,-18],[-7,-27],[7,-27],[0,-36],[-28,0],[28,0]];
  for(let i=0;i<n;i++){ s+=coin(cx+pos[i][0]*1.4, by+pos[i][1]*1.4-14, 14); }
  return s;
}
function adIcon(cx,cy,s=18,bg='#fff',fg=C.orange){
  return `<rect x="${cx-s*0.75}" y="${cy-s*0.5}" width="${s*1.5}" height="${s}" rx="${s*0.25}" fill="${bg}"/>
  <path d="M${cx-s*0.18} ${cy-s*0.28} L${cx+s*0.3} ${cy} L${cx-s*0.18} ${cy+s*0.28}Z" fill="${fg}"/>`;
}
function pill(x,y,w,h,fill='#fff',op=1){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${fill}" opacity="${op}" filter="url(#sh)"/>`;
}
function btn(x,y,w,h,color,inner='',rx=null){
  const d=shade(color,-0.3); rx = rx ?? Math.min(h/2.4, 26);
  return `<g filter="url(#sh)"><rect x="${x}" y="${y+6}" width="${w}" height="${h}" rx="${rx}" fill="${d}"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="${color}"/>
  <rect x="${x+8}" y="${y+5}" width="${w-16}" height="${h*0.36}" rx="${rx*0.7}" fill="#fff" opacity=".22"/></g>`+inner;
}
function ribbon(cx,y,w,text,color,size=26){
  const d=shade(color,-0.35), h=56;
  return `<g filter="url(#sh)">
   <path d="M${cx-w/2-34} ${y+14} h40 v${h} h-40 l14 -${h/2}Z" fill="${d}"/>
   <path d="M${cx+w/2+34} ${y+14} h-40 v${h} h40 l-14 -${h/2}Z" fill="${d}"/>
   <rect x="${cx-w/2}" y="${y}" width="${w}" height="${h}" rx="8" fill="${color}"/>
   <rect x="${cx-w/2+6}" y="${y+5}" width="${w-12}" height="16" rx="6" fill="#fff" opacity=".2"/></g>`+
   T(cx,y+38,text,{size,w:900,fill:'#fff',stroke:d,sw:5});
}

/* ---------- suitcase ---------- */
function suitcase(cx,by,w,h,color,o={}){
  const id=++uid, x=cx-w/2, y=by-h;
  const dark=shade(color,-0.28), light=shade(color,0.3);
  let s=`<g${o.rot?` transform="rotate(${o.rot} ${cx} ${by-h/2})"`:''}${o.op?` opacity="${o.op}"`:''}>`;
  if(!o.noShadow) s+=`<ellipse cx="${cx}" cy="${by+(o.shadowDy||3)}" rx="${w*0.55}" ry="${o.shadowRy||5}" fill="#000" opacity="${o.shadowOp||.18}"/>`;
  s+=`<circle cx="${x+w*0.2}" cy="${by-2}" r="${Math.max(3,w*0.06)}" fill="#2b3240"/><circle cx="${x+w*0.8}" cy="${by-2}" r="${Math.max(3,w*0.06)}" fill="#2b3240"/>`;
  s+=`<rect x="${cx-w*0.17}" y="${y-h*0.16}" width="${w*0.34}" height="${h*0.26}" rx="${w*0.07}" fill="none" stroke="#39414f" stroke-width="${Math.max(3,w*0.07)}"/>`;
  s+=`<defs><linearGradient id="sg${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${light}"/><stop offset=".55" stop-color="${color}"/></linearGradient></defs>`;
  s+=`<rect x="${x}" y="${y}" width="${w}" height="${h-4}" rx="${Math.min(13,w*0.2)}" fill="url(#sg${id})" stroke="${dark}" stroke-width="2.5"/>`;
  s+=`<rect x="${x+w*0.24}" y="${y+5}" width="${w*0.08}" height="${h-14}" rx="2" fill="${dark}" opacity=".35"/>`;
  s+=`<rect x="${x+w*0.68}" y="${y+5}" width="${w*0.08}" height="${h-14}" rx="2" fill="${dark}" opacity=".35"/>`;
  s+=`<rect x="${x+6}" y="${y+4}" width="${w-12}" height="${Math.max(3,h*0.07)}" rx="2" fill="#fff" opacity=".4"/>`;
  if(o.locked){
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${h-4}" rx="${Math.min(13,w*0.2)}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" opacity=".6"/>`;
    s+=T(cx,by-h*0.3,'?',{size:h*0.55,w:900,fill:'#fff',stroke:dark,sw:4});
  } else if(o.tag){
    const tw=Math.max(30,w*0.56), th=Math.max(13,h*0.24);
    s+=`<rect x="${cx-tw/2}" y="${by-h*0.5-th/2}" width="${tw}" height="${th}" rx="4" fill="#fff" opacity=".95"/>`;
    s+=T(cx,by-h*0.5+th*0.33,o.tag,{size:th*0.82,w:800,fill:dark});
  }
  if(o.heavy){
    s+=`<rect x="${cx-26}" y="${by-h*0.5-15}" width="52" height="30" rx="7" fill="#fff" opacity=".95"/>`;
    s+=T(cx,by-h*0.5+6,'25 кг',{size:15,w:900,fill:dark});
  }
  if(o.vip){
    s+=`<circle cx="${x+w-4}" cy="${y+4}" r="14" fill="#2b3240"/>`+star(x+w-4,y+4,11,'url(#gold)','#ffb800',1.5);
  }
  return s+'</g>';
}

/* ---------- airplane (nose at 0,0, facing left) ---------- */
function plane(x,y,s,rot=0,color=C.blue){
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
   <path d="M110 0 L150 -2 L178 -30 L166 -30Z" fill="#d5dde8"/>
   <path d="M18 -14 L196 -14 L226 -50 L250 -50 L238 -12 Q254 -6 252 2 Q250 10 232 12 L24 14 Q0 14 0 0 Q0 -14 18 -14Z" fill="#fff" stroke="#c3cfdd" stroke-width="2"/>
   <path d="M196 -14 L226 -50 L250 -50 L238 -14Z" fill="${color}"/>
   <path d="M3 4 L248 4 L246 9 L8 10Z" fill="${color}"/>
   ${Array.from({length:12},(_,i)=>`<circle cx="${42+i*13}" cy="-4" r="2.6" fill="#5b6b82"/>`).join('')}
   <path d="M7 -6 L20 -9 L22 -3 L5 -2Z" fill="#2f3d52"/>
   <path d="M212 -6 L246 -9 L256 -2 L220 -1Z" fill="#e2e8f0" stroke="#c3cfdd" stroke-width="1.5"/>
   <path d="M95 6 L150 6 L122 44 L105 44Z" fill="#eef2f7" stroke="#c3cfdd" stroke-width="2"/>
   <rect x="92" y="16" width="38" height="15" rx="7.5" fill="#b8c4d3"/>
  </g>`;
}
function cloud(cx,cy,s=1,op=.9){
  return `<g transform="translate(${cx} ${cy}) scale(${s})" opacity="${op}" fill="#fff">
   <circle cx="-22" cy="4" r="16"/><circle cx="0" cy="-6" r="22"/><circle cx="24" cy="4" r="15"/><rect x="-38" y="4" width="78" height="16" rx="8"/></g>`;
}

/* ---------- luggage cart ---------- */
function cart(cx,by,color,code,city,fill,cap=4){
  const dark=shade(color,-0.3);
  let s='';
  s+=`<ellipse cx="${cx-4}" cy="${by+4}" rx="74" ry="9" fill="#000" opacity=".14"/>`;
  // handle
  s+=`<rect x="${cx+52}" y="${by-118}" width="8" height="104" rx="4" fill="#6f7d92"/>`;
  s+=`<rect x="${cx+44}" y="${by-124}" width="26" height="10" rx="5" fill="#39414f"/>`;
  // sign
  s+=`<rect x="${cx-3}" y="${by-160}" width="6" height="40" fill="#8a96a8"/>`;
  s+=`<g filter="url(#sh)"><rect x="${cx-54}" y="${by-212}" width="108" height="58" rx="12" fill="${color}" stroke="${dark}" stroke-width="3"/></g>`;
  s+=`<rect x="${cx-48}" y="${by-207}" width="96" height="14" rx="6" fill="#fff" opacity=".22"/>`;
  s+=T(cx,by-178,code,{size:26,w:900,fill:'#fff',stroke:dark,sw:4});
  s+=T(cx,by-160,city,{size:13,w:700,fill:'#fff',op:.95});
  // slots + suitcases
  const slots=[[cx-30,by-22],[cx+18,by-22],[cx-30,by-74],[cx+18,by-74]];
  for(let i=0;i<cap;i++){
    const [sx,sy]=slots[i];
    if(i<fill) s+=suitcase(sx,sy,44,44,color,{noShadow:true});
    else s+=`<rect x="${sx-22}" y="${sy-44}" width="44" height="40" rx="8" fill="${color}" opacity=".12" stroke="${color}" stroke-width="2" stroke-dasharray="5 4"/>`;
  }
  // platform + wheels
  s+=`<rect x="${cx-66}" y="${by-24}" width="128" height="14" rx="5" fill="#7f8ea3"/><rect x="${cx-66}" y="${by-24}" width="128" height="4" rx="2" fill="#b3bfcf"/>`;
  s+=`<rect x="${cx-68}" y="${by-38}" width="7" height="22" rx="3" fill="#7f8ea3"/>`;
  for(const wx of [cx-46,cx+40]) s+=`<circle cx="${wx}" cy="${by-4}" r="10" fill="#2b3240"/><circle cx="${wx}" cy="${by-4}" r="4" fill="#8a96a8"/>`;
  // counter
  s+=`<rect x="${cx-26}" y="${by+12}" width="52" height="24" rx="12" fill="${C.ink}" opacity=".85"/>`;
  s+=T(cx,by+29,`${fill}/${cap}`,{size:15,w:800,fill:'#fff'});
  return s;
}

/* ---------- booster icons ---------- */
const icons = {
  magnet:(cx,cy)=>`<path d="M${cx-14} ${cy-14} v12 a14 14 0 0 0 28 0 v-12" fill="none" stroke="#ff4d5a" stroke-width="10"/>
     <rect x="${cx-19}" y="${cy-20}" width="10" height="9" fill="#c7d0dc"/><rect x="${cx+9}" y="${cy-20}" width="10" height="9" fill="#c7d0dc"/>`,
  freeze:(cx,cy)=>{let s='';for(const a of [0,60,120]){s+=`<g transform="rotate(${a} ${cx} ${cy})" stroke="#38b6ff" stroke-width="4.5" stroke-linecap="round" fill="none">
     <path d="M${cx} ${cy-20} V${cy+20}"/><path d="M${cx-6} ${cy-15} L${cx} ${cy-9} L${cx+6} ${cy-15}"/><path d="M${cx-6} ${cy+15} L${cx} ${cy+9} L${cx+6} ${cy+15}"/></g>`;}return s;},
  slot:(cx,cy)=>`<rect x="${cx-19}" y="${cy-17}" width="38" height="34" rx="8" fill="none" stroke="#2fc76a" stroke-width="4.5" stroke-dasharray="6 4"/>
     <path d="M${cx} ${cy-9} V${cy+9} M${cx-9} ${cy} H${cx+9}" stroke="#2fc76a" stroke-width="5" stroke-linecap="round"/>`,
  shuffle:(cx,cy)=>`<g fill="none" stroke="#9b5de5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
     <path d="M${cx-20} ${cy-10} h8 l18 20 h10"/><path d="M${cx-20} ${cy+10} h8 l18 -20 h10"/>
     <path d="M${cx+11} ${cy-16} l6 6 l-6 6"/><path d="M${cx+11} ${cy+4} l6 6 l-6 6"/></g>`,
  gift:(cx,cy)=>`<rect x="${cx-16}" y="${cy-4}" width="32" height="20" rx="3" fill="#ff5a5f"/><rect x="${cx-19}" y="${cy-12}" width="38" height="10" rx="3" fill="#ff7a7f"/>
     <rect x="${cx-4}" y="${cy-12}" width="8" height="28" fill="#ffd23f"/><ellipse cx="${cx-7}" cy="${cy-16}" rx="7" ry="5" fill="#ffd23f"/><ellipse cx="${cx+7}" cy="${cy-16}" rx="7" ry="5" fill="#ffd23f"/>`,
  wheel:(cx,cy)=>{const cols=['#ff5a5f','#ffc531','#2fc76a','#3d8bff','#9b5de5','#ff8c2b'];let s='';const r=19;
     for(let i=0;i<6;i++){const a1=i*Math.PI/3-Math.PI/2,a2=a1+Math.PI/3;
       s+=`<path d="M${cx} ${cy} L${cx+r*Math.cos(a1)} ${cy+r*Math.sin(a1)} A${r} ${r} 0 0 1 ${cx+r*Math.cos(a2)} ${cy+r*Math.sin(a2)}Z" fill="${cols[i]}"/>`;}
     return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fff" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="5" fill="#fff"/><path d="M${cx-5} ${cy-24} h10 l-5 9Z" fill="#23324a"/>`;},
  trophy:(cx,cy)=>`<path d="M${cx-13} ${cy-16} h26 v8 a13 13 0 0 1 -26 0Z" fill="url(#gold)" stroke="#d98e00" stroke-width="2"/>
     <path d="M${cx-13} ${cy-12} h-6 a6 7 0 0 0 8 10 M${cx+13} ${cy-12} h6 a6 7 0 0 1 -8 10" fill="none" stroke="#d98e00" stroke-width="3"/>
     <rect x="${cx-3}" y="${cy+4}" width="6" height="7" fill="#d98e00"/><rect x="${cx-11}" y="${cy+11}" width="22" height="6" rx="2" fill="#d98e00"/>`,
  bag:(cx,cy)=>`<path d="M${cx-8} ${cy-8} v-4 a8 8 0 0 1 16 0 v4" fill="none" stroke="#23324a" stroke-width="3.5"/>
     <path d="M${cx-17} ${cy-9} h34 l-3 27 h-28Z" fill="#2fc76a" stroke="#1f9a50" stroke-width="2"/>${coin(cx,cy+5,7)}`,
  noads:(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="18" fill="#fff" stroke="#ff4d5a" stroke-width="4"/>`+T(cx,cy+5,'ADS',{size:12,w:900,fill:'#23324a'})+
     `<path d="M${cx-12} ${cy-12} L${cx+12} ${cy+12}" stroke="#ff4d5a" stroke-width="4" stroke-linecap="round"/>`,
  gear:(cx,cy)=>{let s=`<g fill="#5b6b82">`;for(let i=0;i<8;i++)s+=`<rect x="${cx-4}" y="${cy-17}" width="8" height="10" rx="2" transform="rotate(${i*45} ${cx} ${cy})"/>`;
     return s+`<circle cx="${cx}" cy="${cy}" r="11"/></g><circle cx="${cx}" cy="${cy}" r="5" fill="#fff"/>`;},
  truck:(cx,cy)=>`<path d="M${cx-10} ${cy-16} v28 h20" fill="none" stroke="#5b6b82" stroke-width="4" stroke-linecap="round"/><circle cx="${cx-6}" cy="${cy+14}" r="5" fill="#23324a"/>
     <rect x="${cx-4}" y="${cy-12}" width="16" height="20" rx="3" fill="#ff8c2b"/>`,
  cash:(cx,cy)=>`${coin(cx-6,cy+6,10)}${coin(cx+6,cy+2,10)}${coin(cx,cy-6,10)}`,
  house:(cx,cy)=>`<path d="M${cx-17} ${cy-2} L${cx} ${cy-17} L${cx+17} ${cy-2}Z" fill="#9b5de5"/><rect x="${cx-13}" y="${cy-3}" width="26" height="19" fill="#c9a8f2"/><rect x="${cx-5}" y="${cy+4}" width="10" height="12" fill="#6b3fb0"/>`,
  people:(cx,cy)=>`<circle cx="${cx-7}" cy="${cy-8}" r="7" fill="#3d8bff"/><path d="M${cx-19} ${cy+12} a12 12 0 0 1 24 0Z" fill="#3d8bff"/>
     <circle cx="${cx+8}" cy="${cy-6}" r="6" fill="#9b5de5"/><path d="M${cx-1} ${cy+12} a10 10 0 0 1 20 0Z" fill="#9b5de5"/>`,
  lock:(cx,cy)=>`<path d="M${cx-5} ${cy-2} v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#fff" stroke-width="2.5"/><rect x="${cx-7}" y="${cy-2}" width="14" height="10" rx="2" fill="#fff"/>`,
  pause:(cx,cy)=>`<rect x="${cx-8}" y="${cy-10}" width="6" height="20" rx="2" fill="${C.ink}"/><rect x="${cx+2}" y="${cy-10}" width="6" height="20" rx="2" fill="${C.ink}"/>`,
};

function coinsPill(x,y,value){
  return pill(x,y,130,42)+coin(x+22,y+21,15)+T(x+76,y+29,value,{size:21,w:800})+
    `<circle cx="${x+120}" cy="${y+21}" r="11" fill="${C.green}"/><path d="M${x+120} ${y+15} v12 M${x+114} ${y+21} h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
}

/* ================= GAMEPLAY ================= */
function gameplayScene(){
  let s='';
  s+=`<rect width="540" height="960" fill="#dde5ee"/>`;
  // floor tiles
  for(let y=300;y<960;y+=64) s+=`<rect x="0" y="${y}" width="540" height="2" fill="#cfd9e5"/>`;
  for(let x=0;x<540;x+=90) s+=`<rect x="${x}" y="258" width="2" height="702" fill="#d3dce7"/>`;
  // window wall
  s+=`<rect width="540" height="232" fill="#e9eff6"/>`;
  s+=`<rect x="0" y="58" width="540" height="164" fill="url(#sky)"/>`;
  s+=cloud(90,150,1.0)+cloud(430,140,.8)+cloud(250,170,.6,.7);
  s+=`<rect x="0" y="184" width="540" height="18" fill="#9fd48a"/><rect x="0" y="198" width="540" height="24" fill="#8c98a8"/>`;
  for(let x=10;x<540;x+=60) s+=`<rect x="${x}" y="209" width="30" height="3" fill="#fff" opacity=".8"/>`;
  s+=plane(300,120,.62,12,C.red);
  s+=plane(60,100,.22,8,C.blue);
  for(const x of [-4,131,266,401,536]) s+=`<rect x="${x}" y="58" width="8" height="164" fill="#c5d0dd"/>`;
  s+=`<rect x="0" y="52" width="540" height="10" fill="#c5d0dd"/><rect x="0" y="218" width="540" height="14" fill="#b6c3d3"/>`;

  // HUD
  s+=`<circle cx="40" cy="38" r="24" fill="#fff" filter="url(#sh)"/>`+icons.pause(40,38);
  s+=pill(190,16,160,44)+T(270,46,'Уровень 7',{size:22,w:800});
  s+=coinsPill(396,17,'1 250');
  // flights progress
  s+=pill(130,74,280,40,'#fff',.96);
  s+=T(156,100,'Рейсы',{size:16,w:700,anchor:'start',fill:C.sub});
